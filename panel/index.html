<!doctype html>
<html lang="cs">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel klientů</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: horný pás klient + filtre, KPI pás, graf týždňov vedľa platforiem, formáty vedľa vyhodnotenia, tabuľka videí */
:root {
  --bg: #f6f3ef; --panel: #ffffff; --ink: #221d1a; --muted: #786e66; --line: #e7e0d8; --soft: #efe9e2;
  --accent: #f7861f; --good: #2f9e5a; --warn: #d9822b; --bad: #cf3f3a;
  --yt: #e5352b; --tt: #1f1f24; --ig: #c13584; --fb: #2f6fdd;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171412; --panel: #211d1a; --ink: #f3ede7; --muted: #a89c92; --line: #352e29; --soft: #2a2420; --tt: #e8e6ea; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #171412; --panel: #211d1a; --ink: #f3ede7; --muted: #a89c92; --line: #352e29; --soft: #2a2420; --tt: #e8e6ea; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 48px; display: grid; gap: 18px }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between }
h1 { font: 800 clamp(24px, 3.4vw, 34px)/1.1 var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance }
h2 { font: 600 17px/1.2 var(--display); margin: 0 0 12px }
.sub { color: var(--muted); font-size: 13px }
.demo { display: inline-block; vertical-align: middle; margin-left: 8px; font: 700 11px/1 var(--body); letter-spacing: .08em;
  padding: 5px 8px; border-radius: 6px; background: var(--warn); color: #fff }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap }
.seg button { border: 0; background: none; color: var(--muted); font: 500 13px var(--body); padding: 6px 11px; border-radius: 8px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px #0002 }
.seg button:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
select { font: 500 14px var(--body); padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink) }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0 }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px }
.kpi .label { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase }
.kpi .val { font: 800 28px/1.15 var(--display); font-variant-numeric: tabular-nums; margin-top: 4px }
.delta { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums }
.up { color: var(--good) } .down { color: var(--bad) } .flat { color: var(--muted) }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 12px }
svg text { fill: var(--muted); font: 11px var(--body) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-top: 6px }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: 0 }
.rows { display: grid; gap: 10px }
.row { display: grid; grid-template-columns: 84px minmax(0, 1fr) 72px; gap: 10px; align-items: center; font-size: 14px }
.track { height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden }
.fill { height: 100% ; border-radius: 5px }
.num { font-variant-numeric: tabular-nums; text-align: right }
table { width: 100%; border-collapse: collapse; font-size: 14px }
th, td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap }
td.t { white-space: normal; min-width: 180px }
th { font-size: 12px; color: var(--muted); font-weight: 500 }
th button { all: unset; cursor: pointer } th button::after { content: attr(data-s); margin-left: 3px }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums }
.scroll { overflow-x: auto }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--soft) }
.pill.good { color: var(--good) } .pill.bad { color: var(--bad) }
.plat { font-weight: 700; font-size: 12px }
.ins ul { margin: 0; padding-left: 18px } .ins li { margin-bottom: 7px } .ins h3 { font: 600 15px var(--display); margin: 0 0 8px }
.ins p { margin: 0 0 8px }
.empty { color: var(--muted); padding: 30px 0; text-align: center }
footer { color: var(--muted); font-size: 12px }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) } .grid2 { grid-template-columns: 1fr } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="name"></h1>
      <div class="sub" id="channels"></div>
    </div>
    <div class="bar">
      <select id="client" aria-label="Klient"></select>
      <div class="seg" id="period" role="group" aria-label="Období"></div>
      <div class="seg" id="plats" role="group" aria-label="Platforma"></div>
    </div>
  </header>
  <section class="kpis" id="kpis"></section>
  <section class="box" id="acctbox"><h2>Kanály spolu</h2><div class="scroll"><table id="accts"></table></div></section>
  <section class="grid2">
    <div class="box"><h2>Zhlédnutí podle týdne zveřejnění</h2><div id="weeks"></div><div class="legend" id="legend"></div></div>
    <div class="box"><h2>Platformy</h2><div class="rows" id="platrows"></div></div>
  </section>
  <section class="grid2">
    <div class="box"><h2>Formáty</h2><div class="scroll"><table id="formats"></table></div></div>
    <div class="box ins"><h2>Vyhodnocení a další kroky</h2><div id="insights"></div></div>
  </section>
  <section class="grid2">
    <div class="box"><h2>Čas zveřejnění</h2><div class="rows" id="times"></div></div>
    <div class="box"><h2>Délka videa</h2><div class="rows" id="lengths"></div></div>
  </section>
  <section class="box"><h2>Videa</h2><div class="scroll"><table id="videos"></table></div></section>
  <footer id="foot"></footer>
</div>

      return `<tr><td>${esc(v.published)}</td><td>${esc(v.time || '')}</td><td><span class="plat" style="color:${PL[v.platform]?.[1]}">${PL[v.platform]?.[0] || esc(v.platform)}</span></td><td class="t">${t}</td><td>${esc(v.format)}</td>
        <td class="n">${fmt(+v.views || 0)}</td><td class="n">${v.avg_view_pct !== '' ? pct(v.avg_view_pct) : '–'}</td><td class="n">${fmt(+v.likes || 0)}</td><td class="n">${fmt(+v.comments || 0)}</td><td class="n">${fmt(+v.shares || 0)}</td><td class="n">${fmt(+v.followers || 0)}</td><td class="n">${eurF((+v.views || 0) * RATE)}</td><td>${flag}</td></tr>`;
    }).join('') + (rows.length ? '' : `<tr><td colspan="13" class="empty">Žádná videa v období. Import: python3 panel.py import ${esc(c.id)} export.csv</td></tr>`);
  $('videos').querySelectorAll('th button').forEach(b => b.onclick = () => { st.sort = [b.dataset.k, st.sort[0] === b.dataset.k ? -st.sort[1] : -1]; save(); render(); });
  const upd = all.reduce((m, v) => v.updated > m ? v.updated : m, '');
  $('foot').textContent = `Data aktualizována ${upd || '–'} · panel sestaven ${D.built} · ${c.demo ? 'ukázková (vymyšlená) čísla' : 'zdroj: exporty z YouTube Studio, TikTok Studio, Meta Business Suite'}`;
}

function buckets(el, cur, key, emptyMsg) {
  const G = {};
  cur.forEach(v => { const k = key(v); if (k) (G[k[2]] ||= {l: k[0], s: k[1], a: []}).a.push(v); });
  const rows = Object.keys(G).sort().map(k => ({...G[k], vpv: sum(G[k].a, 'views') / G[k].a.length, pct: avgW(G[k].a, 'avg_view_pct')}));
  if (!rows.length) { el.innerHTML = `<div class="empty">${emptyMsg}</div>`; return; }
  const max = Math.max(...rows.map(r => r.vpv)) || 1;
  el.innerHTML = rows.map(r => `<div class="row"><span class="plat">${r.l}${r.s ? `<br><span class="sub" style="font-weight:400">${r.s}</span>` : ''}</span><div class="track"><div class="fill" style="width:${r.vpv / max * 100}%;background:var(--accent)"></div></div><span class="num">${fmt(r.vpv)}</span></div>
    <div class="row sub" style="margin-top:-6px"><span></span><span style="grid-column:2/4">zhl. na video · ${r.a.length} videí${r.pct ? ' · dokoukání ' + pct(r.pct) : ''}</span></div>`).join('');
}

function weeks(cur, used) {
  const W = {};
  cur.forEach(v => { const d = day(v.published); d.setDate(d.getDate() - (d.getDay() + 6) % 7); const k = d.toISOString().slice(0, 10); (W[k] ||= {})[v.platform] = (W[k][v.platform] || 0) + (+v.views || 0); });
  const keys = Object.keys(W).sort();
  if (!keys.length) { $('weeks').innerHTML = '<div class="empty">Žádná data v období</div>'; $('legend').innerHTML = ''; return; }
  const ps = used.filter(p => st.plat === 'all' || p === st.plat);
  const max = Math.max(...keys.map(k => ps.reduce((s, p) => s + (W[k][p] || 0), 0)));
  const step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / step) * step;
  const w = 640, h = 220, L = 46, B = 24, bw = (w - L) / keys.length;
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = h - B - (h - B - 8) * i / 4; g += `<line x1="${L}" x2="${w}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${fmt(top * i / 4)}</text>`; }
  keys.forEach((k, i) => {
    let y = h - B;
    ps.forEach(p => { const v = W[k][p] || 0, bh = v / top * (h - B - 8); y -= bh; g += `<rect x="${L + i * bw + bw * 0.18}" y="${y}" width="${bw * 0.64}" height="${bh}" fill="${PL[p][1]}" rx="2"><title>${PL[p][0]} ${fmt(v)}</title></rect>`; });
    if (keys.length <= 10 || i % 2 === 0) { const d = day(k); g += `<text x="${L + i * bw + bw / 2}" y="${h - 6}" text-anchor="middle">${d.getDate()}. ${d.getMonth() + 1}.</text>`; }
  });
  $('weeks').innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Zhlédnutí podle týdne">${g}</svg>`;
  $('legend').innerHTML = ps.map(p => `<span><span class="dot" style="background:${PL[p][1]}"></span>${PL[p][0]}</span>`).join('');
}

function md(s) {
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let out = '', list = false;
  s.split('\n').forEach(l => {
    if (/^\s*[-*] /.test(l)) { if (!list) { out += '<ul>'; list = true; } out += `<li>${inl(l.replace(/^\s*[-*] /, ''))}</li>`; return; }
    if (list) { out += '</ul>'; list = false; }
    if (/^#+ /.test(l)) out += `<h3>${inl(l.replace(/^#+ /, ''))}</h3>`;
    else if (l.trim()) out += `<p>${inl(l)}</p>`;
  });
  return out + (list ? '</ul>' : '');
}

$('client').onchange = e => { st.client = +e.target.value; st.plat = 'all'; save(); render(); };
render();
</script>

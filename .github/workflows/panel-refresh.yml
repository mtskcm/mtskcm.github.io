name: Panel – obnoviť zhliadnutia
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: panel-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obnoviť YouTube, Instagram, Facebook
        env:
          PANEL_TOKENS: ${{ secrets.PANEL_TOKENS }}
        run: python3 .github/scripts/panel_refresh.py
      - name: Zverejniť
        run: |
          git config user.name "panel-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add panel/index.html
          git diff --cached --quiet && { echo "bez zmeny"; exit 0; }
          git commit -m "Panel: obnovené zhliadnutia $(TZ=Europe/Bratislava date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
